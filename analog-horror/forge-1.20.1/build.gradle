plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '2.0.0'
group = 'com.krolasyon.horror'
base { archivesName = 'krolasyon_horror-1.20.1-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.java.srcDirs += '../common/src/main/java'
sourceSets.main.resources.srcDirs += '../common/src/main/resources'

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'krolasyon.autotest', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--width', '1280', '--height', '720'
            mods { krolasyonhorror { source sourceSets.main } }
        }
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex('software\\.bernie.*'); includeGroup('com.eliotlash.mclib') }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.8.4')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach { duplicatesStrategy = DuplicatesStrategy.INCLUDE }

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "krolasyonhorror", "Specification-Vendor": "krolasyon", "Specification-Version": "1",
                    "Implementation-Title": project.name, "Implementation-Version": project.jar.archiveVersion])
    }
    finalizedBy 'reobfJar'
}
