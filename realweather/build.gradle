plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'com.krolasyon.realweather'
base { archivesName = 'krolasyon_realweather-1.20.1-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'realweather.autotest', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--width', '1280', '--height', '720'
            mods {
                realweather {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    // yalnızca shader testi için (-PoculusVersion=... -PembeddiumVersion=...)
    if (project.hasProperty('oculusVersion')) {
        runtimeOnly fg.deobf("maven.modrinth:embeddium:${embeddiumVersion}")
        runtimeOnly fg.deobf("maven.modrinth:oculus:${oculusVersion}")
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "realweather", "Specification-Vendor": "krolasyon",
                    "Specification-Version": "1", "Implementation-Title": project.name,
                    "Implementation-Version": project.jar.archiveVersion])
    }
    finalizedBy 'reobfJar'
}
