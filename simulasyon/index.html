<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaos Laboratuvarı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tam ekran simülasyon tuvali, üzerinde yüzen cam bir kontrol paneli (telefonda alt tabaka). Tek, bilinçli koyu görünüm. */
:root{
  --bg:#06070b;
  --panel:rgba(13,14,20,.80);
  --line:rgba(255,232,196,.11);
  --fg:#ece5d8;
  --dim:#958e82;
  --accent:#ffb44a;
  --cool:#7cc8ff;
  --font-d:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-d);overflow:hidden;-webkit-font-smoothing:antialiased}
#view{position:fixed;inset:0;touch-action:none;cursor:crosshair}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--dim);font-family:var(--font-m);font-size:13px}

#panel{position:fixed;z-index:3;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  width:324px;max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;background:var(--panel);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden}
#panel.gone{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 12px 16px}
.brand{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.05;font-variation-settings:"opsz" 96}
.brand small{display:block;margin-top:3px;font:400 9.5px/1 var(--font-m);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.meta{display:flex;white-space:nowrap;flex-shrink:0;align-items:center;gap:8px;font:500 11px/1 var(--font-m);color:var(--dim);font-variant-numeric:tabular-nums}
#pausedTag{color:var(--accent);letter-spacing:.1em}
.icon-btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);width:28px;height:28px;border-radius:8px;cursor:pointer;font:500 13px/1 var(--font-m);display:grid;place-items:center}
.icon-btn:hover{border-color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 12px 12px}
.tab{appearance:none;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;border-radius:9px;padding:7px 0 8px;
  font:500 11px/1.1 var(--font-d);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s,border-color .15s,background .15s}
.tab b{font:500 9px/1 var(--font-m);opacity:.7}
.tab:hover{color:var(--fg);border-color:rgba(255,180,74,.45)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#1a1206}
.pbody{overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
#panel.collapsed .pbody{display:none}
#panel.collapsed .tabs{padding-bottom:12px}
h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;font-variation-settings:"opsz" 72}
.desc{margin:6px 0 0;color:var(--dim);font-size:13px;line-height:1.5}
.sec{display:flex;flex-direction:column;gap:12px}
.label{font:500 9.5px/1 var(--font-m);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.ctl output{font:500 11.5px/1 var(--font-m);color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(255,232,196,.14) var(--fill,50%))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,232,196,.14)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;border-radius:50%;background:var(--fg);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--fg);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent)}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.chip{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--fg);cursor:pointer;border-radius:999px;padding:6px 10px;font:500 11.5px/1 var(--font-d)}
.chip:hover{border-color:rgba(255,180,74,.5)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(255,180,74,.08)}
.chip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.eq{margin:0;padding:10px 12px;border-radius:9px;background:rgba(0,0,0,.3);border:1px solid var(--line);font:400 11.5px/1.65 var(--font-m);color:var(--fg);white-space:pre;overflow-x:auto}
.eq em{font-style:normal;color:var(--dim)}
canvas.figure{display:block;width:100%;border-radius:9px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.figcap{font-size:11.5px;color:var(--dim);line-height:1.45;margin:0}
.tele-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#teleVal{font:500 15px/1 var(--font-m);color:var(--fg);font-variant-numeric:tabular-nums}
#spark{height:64px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{appearance:none;cursor:pointer;border-radius:9px;padding:9px 12px;font:600 12.5px/1 var(--font-d);border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.keys{font:400 10.5px/1.9 var(--font-m);color:var(--dim)}
kbd{font:500 10px/1 var(--font-m);padding:2px 5px;border-radius:4px;border:1px solid var(--line);color:var(--fg);background:rgba(255,255,255,.04)}
#hint{position:fixed;z-index:2;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  font:400 11px/1.2 var(--font-m);color:var(--dim);padding:8px 11px;border-radius:999px;background:rgba(6,7,11,.6);border:1px solid var(--line);pointer-events:none;max-width:calc(100% - 32px)}
#showPanel{position:fixed;z-index:3;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:auto;padding:0 12px;height:34px;background:var(--panel)}
@media (max-width:720px){
  #panel{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:56%}
  #hint{top:calc(16px + env(safe-area-inset-top,0px));bottom:auto;right:max(16px,env(safe-area-inset-right,0px))}
  h2{font-size:21px}
}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}
</style>
</head>
<body>

<div id="view">
  <canvas id="c2d" class="layer"></canvas>
  <canvas id="cgl" class="layer" hidden></canvas>
  <div id="msg" hidden></div>
</div>

<aside id="panel" aria-label="Simülasyon kontrolleri">
  <div class="ph">
    <div class="brand">Kaos Laboratuvarı<small>Canlı simülasyon</small></div>
    <div class="meta">
      <span id="pausedTag" hidden>DURDU</span>
      <span id="fps">— fps</span>
      <button class="icon-btn" id="collapse" type="button" aria-label="Paneli daralt" title="Paneli daralt">–</button>
      <button class="icon-btn" id="hide" type="button" aria-label="Paneli gizle (H)" title="Paneli gizle (H)">×</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="pbody">
    <div>
      <h2 id="mTitle"></h2>
      <p class="desc" id="mDesc"></p>
    </div>
    <div class="sec" id="extra"></div>
    <div class="sec">
      <span class="label">Parametreler</span>
      <div class="sec" id="controls"></div>
    </div>
    <div class="sec">
      <div class="tele-head"><span class="label" id="teleLabel"></span><span id="teleVal">—</span></div>
      <canvas id="spark" class="figure"></canvas>
    </div>
    <div class="actions" id="actions">
      <button class="btn primary" id="pauseBtn" type="button">Duraklat</button>
      <button class="btn" id="resetBtn" type="button">Sıfırla</button>
    </div>
    <div class="keys"><kbd>Boşluk</kbd> duraklat · <kbd>R</kbd> sıfırla · <kbd>1</kbd>–<kbd>5</kbd> mod · <kbd>H</kbd> paneli gizle</div>
  </div>
</aside>
<button class="icon-btn" id="showPanel" type="button" hidden>Paneli göster</button>
<div id="hint"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const view = $('#view'), cv = $('#c2d'), ctx = cv.getContext('2d'), glc = $('#cgl');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 1, H = 1, DPR = 1;
let paused = false, mode = null, frame = 0;
const ptr = { x: 0, y: 0, px: 0, py: 0, down: false, active: false, shift: false };
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const trNum = (v, d) => (d == null ? String(Math.round(v)) : v.toFixed(d)).replace('.', ',');

/* ---------- çizim yardımcıları ---------- */
function hsl(h, s, l) {
  h = (((h % 360) + 360) % 360) / 360;
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h * 12) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return `${f(0)},${f(8)},${f(4)}`;
}
function sprite(rgb, r = 16) {
  const c = document.createElement('canvas'); c.width = c.height = r * 2;
  const g = c.getContext('2d'), gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.2, `rgba(${rgb},.75)`);
  gr.addColorStop(.5, `rgba(${rgb},.16)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2); return c;
}
function fade(a) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(6,7,11,${a})`; ctx.fillRect(0, 0, W, H);
}
function clear2d() { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#06070b'; ctx.fillRect(0, 0, W, H); }
function lerpRGB(stops, t) {
  t = clamp(t, 0, 1) * (stops.length - 1); const i = Math.min(stops.length - 2, Math.floor(t)), f = t - i;
  const a = stops[i], b = stops[i + 1];
  return `${Math.round(a[0] + (b[0] - a[0]) * f)},${Math.round(a[1] + (b[1] - a[1]) * f)},${Math.round(a[2] + (b[2] - a[2]) * f)}`;
}

/* ---------- uzaysal ızgara (komşu araması) ---------- */
function gridBuild(g, x, y, N, cell) {
  const cols = Math.max(1, Math.floor(W / cell)), rows = Math.max(1, Math.floor(H / cell)), nc = cols * rows;
  if (!g.start || g.start.length < nc + 1) { g.start = new Int32Array(nc + 1); g.fill = new Int32Array(nc); }
  if (!g.order || g.order.length < N) { g.order = new Int32Array(N); g.cellOf = new Int32Array(N); }
  const cw = W / cols, ch = H / rows, st = g.start, fl = g.fill, ord = g.order, co = g.cellOf;
  st.fill(0, 0, nc + 1);
  for (let i = 0; i < N; i++) {
    const cx = Math.min(cols - 1, Math.max(0, (x[i] / cw) | 0)), cy = Math.min(rows - 1, Math.max(0, (y[i] / ch) | 0));
    const c = cy * cols + cx; co[i] = c; st[c + 1]++;
  }
  for (let c = 0; c < nc; c++) { st[c + 1] += st[c]; fl[c] = st[c]; }
  for (let i = 0; i < N; i++) ord[fl[co[i]]++] = i;
  g.cols = cols; g.rows = rows;
}
function gridNeighbors(g, c, nb) {
  const cols = g.cols, rows = g.rows, cx = c % cols, cy = (c / cols) | 0; let n = 0;
  for (let oy = -1; oy <= 1; oy++) {
    const yy = (cy + oy + rows) % rows;
    for (let ox = -1; ox <= 1; ox++) {
      const cc = yy * cols + (cx + ox + cols) % cols; let dup = false;
      for (let q = 0; q < n; q++) if (nb[q] === cc) { dup = true; break; }
      if (!dup) nb[n++] = cc;
    }
  }
  return n;
}
const NB = new Int32Array(9);

/* ---------- 3B kamera ---------- */
function makeCam(yaw, pitch) { return { yaw, pitch, zoom: 1, c: 1, s: 0, cp: 1, sp: 0 }; }
function camPrep(cam) { cam.c = Math.cos(cam.yaw); cam.s = Math.sin(cam.yaw); cam.cp = Math.cos(cam.pitch); cam.sp = Math.sin(cam.pitch); }

/* =====================================================================
   1) PARÇACIK YAŞAMI
   ===================================================================== */
const Life = {
  id: 'yasam', tab: 'Yaşam', title: 'Parçacık Yaşamı',
  desc: 'Her renk diğer renkleri farklı güçte çeker ya da iter. Bu küçük kural tablosundan hücreye, solucana ve yörüngeye benzeyen yapılar kendiliğinden çıkar.',
  hint: 'Sürükle: parçacıkları çek · Shift + sürükle: it',
  tele: { label: 'Ortalama hız', unit: ' px/s' },
  params: {
    n: { label: 'Parçacık sayısı', min: 300, max: 4000, step: 100, v: 2200, reinit: true },
    k: { label: 'Tür sayısı', min: 2, max: 8, step: 1, v: 6, reinit: true },
    r: { label: 'Etki yarıçapı', min: 30, max: 160, step: 5, v: 80, unit: ' px' },
    hl: { label: 'Sürtünme yarı ömrü', min: 0.01, max: 0.2, step: 0.005, v: 0.04, dec: 3, unit: ' s' },
    f: { label: 'Kuvvet çarpanı', min: 1, max: 25, step: 0.5, v: 10, dec: 1 },
  },
  actions: [{ label: 'Yeni kurallar', fn() { Life.randomRules(); Life.drawMatrix(); } }],
  g: {},
  randomRules() {
    const K = this.params.k.v; this.M = new Float32Array(K * K);
    for (let i = 0; i < K * K; i++) this.M[i] = Math.round((Math.random() * 2 - 1) * 4) / 4;
    this.cols = []; this.spr = [];
    for (let t = 0; t < K; t++) { const rgb = hsl(18 + t * 360 / K, .86, .62); this.cols.push(rgb); this.spr.push(sprite(rgb, 12)); }
  },
  init() {
    const N = this.params.n.v, K = this.params.k.v;
    if (!this.M || this.M.length !== K * K) this.randomRules();
    this.N = N; this.x = new Float32Array(N); this.y = new Float32Array(N);
    this.vx = new Float32Array(N); this.vy = new Float32Array(N);
    this.fx = new Float32Array(N); this.fy = new Float32Array(N); this.t = new Uint8Array(N);
    for (let i = 0; i < N; i++) { this.x[i] = Math.random() * W; this.y[i] = Math.random() * H; this.t[i] = i % K; }
    clear2d();
  },
  resize(ow, oh) { for (let i = 0; i < this.N; i++) { this.x[i] = this.x[i] / ow * W; this.y[i] = this.y[i] / oh * H; } },
  step() {
    const N = this.N, K = this.params.k.v, M = this.M, x = this.x, y = this.y, vx = this.vx, vy = this.vy, t = this.t, FX = this.fx, FY = this.fy;
    const dt = 0.02, rmax = this.params.r.v, r2 = rmax * rmax, beta = 0.3;
    const fric = Math.pow(0.5, dt / this.params.hl.v), ff = this.params.f.v * rmax;
    const g = this.g; gridBuild(g, x, y, N, rmax);
    const st = g.start, ord = g.order, co = g.cellOf, hw = W / 2, hh = H / 2;
    for (let i = 0; i < N; i++) {
      const xi = x[i], yi = y[i], ti = t[i] * K; let fx = 0, fy = 0;
      const nn = gridNeighbors(g, co[i], NB);
      for (let q = 0; q < nn; q++) {
        const c = NB[q], e = st[c + 1];
        for (let s = st[c]; s < e; s++) {
          const j = ord[s]; if (j === i) continue;
          let dx = x[j] - xi, dy = y[j] - yi;
          if (dx > hw) dx -= W; else if (dx < -hw) dx += W;
          if (dy > hh) dy -= H; else if (dy < -hh) dy += H;
          const d2 = dx * dx + dy * dy;
          if (d2 < r2 && d2 > 1e-4) {
            const d = Math.sqrt(d2), rr = d / rmax;
            const F = rr < beta ? rr / beta - 1 : M[ti + t[j]] * (1 - Math.abs(2 * rr - 1 - beta) / (1 - beta));
            fx += dx / d * F; fy += dy / d * F;
          }
        }
      }
      FX[i] = fx * ff; FY[i] = fy * ff;
    }
    let sp = 0;
    for (let i = 0; i < N; i++) {
      let ax = FX[i], ay = FY[i];
      if (ptr.down) {
        const dx = ptr.x - x[i], dy = ptr.y - y[i], d = Math.hypot(dx, dy) + 1e-3;
        if (d < 200) { const s = (ptr.shift ? -1 : 1) * 2600 * (1 - d / 200); ax += dx / d * s; ay += dy / d * s; }
      }
      vx[i] = vx[i] * fric + ax * dt; vy[i] = vy[i] * fric + ay * dt;
      x[i] += vx[i] * dt; y[i] += vy[i] * dt;
      if (x[i] < 0) x[i] += W; else if (x[i] >= W) x[i] -= W;
      if (y[i] < 0) y[i] += H; else if (y[i] >= H) y[i] -= H;
      sp += Math.hypot(vx[i], vy[i]);
    }
    tele.push(sp / N);
  },
  draw() {
    fade(.22); ctx.globalCompositeOperation = 'lighter';
    const x = this.x, y = this.y, t = this.t, spr = this.spr, s = 11, h = s / 2;
    for (let i = 0; i < this.N; i++) ctx.drawImage(spr[t[i]], x[i] - h, y[i] - h, s, s);
  },
  extra(el) {
    el.innerHTML = `<span class="label">Çekim tablosu</span><canvas class="figure" id="matrix" height="220"></canvas>
      <p class="figcap">Satırdaki renk, sütundaki rengi ne kadar çekiyor? Mavi çekim, kırmızı itme. Bir hücreye tıklayıp değerini değiştir.</p>`;
    const m = el.querySelector('#matrix');
    m.addEventListener('pointerdown', e => {
      const K = this.params.k.v, r = m.getBoundingClientRect(), cell = Math.min(r.width, r.height) / (K + 1);
      const ox = (r.width - cell * (K + 1)) / 2;
      const cx = Math.floor((e.clientX - r.left - ox) / cell) - 1, cy = Math.floor((e.clientY - r.top) / cell) - 1;
      if (cx < 0 || cy < 0 || cx >= K || cy >= K) return;
      const i = cy * K + cx, d = e.shiftKey || e.button === 2 ? -0.25 : 0.25;
      let v = this.M[i] + d; if (v > 1) v = -1; if (v < -1) v = 1; this.M[i] = v; this.drawMatrix();
    });
    m.addEventListener('contextmenu', e => e.preventDefault());
    this.drawMatrix();
  },
  drawMatrix() {
    const m = $('#matrix'); if (!m) return;
    const w = m.clientWidth, h = 220; m.width = w * DPR; m.height = h * DPR; m.style.height = h + 'px';
    const g = m.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, w, h);
    const K = this.params.k.v, cell = Math.min(w, h) / (K + 1), ox = (w - cell * (K + 1)) / 2, pad = 1.5;
    for (let i = 0; i < K; i++) {
      g.fillStyle = `rgb(${this.cols[i]})`;
      g.beginPath(); g.arc(ox + cell * (i + 1.5), cell * .5, cell * .2, 0, 7); g.fill();
      g.beginPath(); g.arc(ox + cell * .5, cell * (i + 1.5), cell * .2, 0, 7); g.fill();
      for (let j = 0; j < K; j++) {
        const v = this.M[i * K + j], a = Math.abs(v);
        g.fillStyle = v >= 0 ? `rgba(124,200,255,${.12 + a * .78})` : `rgba(255,96,96,${.12 + a * .78})`;
        g.fillRect(ox + cell * (j + 1) + pad, cell * (i + 1) + pad, cell - pad * 2, cell - pad * 2);
        if (cell > 26) {

const VS = `#version 300 es
layout(location=0) in vec2 p; out vec2 uv;
void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;

precision highp float;
uniform sampler2D s; uniform vec2 px; uniform float F, K, uMap, uBrush; uniform vec3 brush;
in vec2 uv; out vec4 o;
void main(){

    + .2 * (texture(s, uv + vec2(px.x, 0.)).rg + texture(s, uv - vec2(px.x, 0.)).rg

    vec2 d = (uv - brush.xy) / px;

precision highp float;
uniform sampler2D s; uniform vec2 px; uniform vec3 c0, c1, c2, c3;

  if (t < .33) return mix(c0, c1, t / .33);

/* ---------- telemetri (canlı çizgi grafik) ---------- */
const tele = {
  buf: new Float32Array(300), n: 0, i: 0,
  push(v) { if (!isFinite(v)) return; this.buf[this.i] = v; this.i = (this.i + 1) % this.buf.length; this.n = Math.min(this.n + 1, this.buf.length); this.last = v; },
  reset() { this.n = 0; this.i = 0; this.last = undefined; },
  draw() {
    const c = $('#spark'), w = c.clientWidth, h = 64; if (!w) return;
    if (c.width !== Math.round(w * DPR)) { c.width = Math.round(w * DPR); c.height = h * DPR; }
    const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, w, h);
    const T = mode.tele; $('#teleVal').textContent = this.last == null ? '—' : trNum(this.last, T.dec) + (T.unit || '');
    g.strokeStyle = 'rgba(236,229,216,.06)'; g.lineWidth = 1;
    for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(0, k * h / 4 + .5); g.lineTo(w, k * h / 4 + .5); g.stroke(); }
    if (this.n < 2) return;
    let lo = Infinity, hi = -Infinity;
    for (let k = 0; k < this.n; k++) { const v = this.buf[(this.i - this.n + k + this.buf.length) % this.buf.length]; if (v < lo) lo = v; if (v > hi) hi = v; }
    if (T.range) { lo = T.range[0]; hi = T.range[1]; } else { const pad = (hi - lo) * .12 || Math.abs(hi) * .1 || 1; lo -= pad; hi += pad; }
    const N = this.buf.length, X = k => (k + (N - this.n)) / (N - 1) * w, Y = v => 6 + (1 - (v - lo) / (hi - lo)) * (h - 12);
    g.beginPath();
    for (let k = 0; k < this.n; k++) { const v = this.buf[(this.i - this.n + k + N) % N]; k ? g.lineTo(X(k), Y(v)) : g.moveTo(X(k), Y(v)); }
    const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, 'rgba(255,180,74,.28)'); grd.addColorStop(1, 'rgba(255,180,74,0)');
    g.lineWidth = 1.5; g.strokeStyle = '#ffb44a'; g.lineJoin = 'round'; g.stroke();
    g.lineTo(X(this.n - 1), h); g.lineTo(X(0), h); g.closePath(); g.fillStyle = grd; g.fill();
    const ex = X(this.n - 1), ey = Y(this.last);
    g.fillStyle = '#ffb44a'; g.beginPath(); g.arc(ex - 2, ey, 3, 0, 7); g.fill();
    g.fillStyle = 'rgba(149,142,130,1)'; g.font = '500 9px "IBM Plex Mono", monospace'; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(trNum(hi, T.dec), 4, 3); g.textBaseline = 'bottom'; g.fillText(trNum(lo, T.dec), 4, h - 2);
  },
};

/* ---------- arayüz ---------- */
const MODES = [Life, Gal, RD, Att, Boids];
function showMsg(t) { const m = $('#msg'); m.textContent = t; m.hidden = false; }
function hideMsg() { $('#msg').hidden = true; }
function fmt(p) { return trNum(p.v, p.dec) + (p.unit || ''); }
function fillPct(p) { return ((p.v - p.min) / (p.max - p.min) * 100).toFixed(1) + '%'; }
function setParam(k, v) { const p = mode.params[k]; p.v = v; if (p.el) { p.el.value = v; p.out.textContent = fmt(p); p.el.style.setProperty('--fill', fillPct(p)); } }

function buildTabs() {
  const t = $('#tabs');
  t.innerHTML = MODES.map((m, i) => `<button class="tab" type="button" role="tab" data-i="${i}" id="tab-${m.id}"><b>${i + 1}</b>${m.tab}</button>`).join('');
  t.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setMode(+b.dataset.i); });
}
function buildUI() {
  $('#mTitle').textContent = mode.title; $('#mDesc').textContent = mode.desc; $('#hint').textContent = mode.hint;
  $('#teleLabel').textContent = mode.tele.label;
  document.querySelectorAll('.tab').forEach((b, i) => b.setAttribute('aria-selected', String(MODES[i] === mode)));
  const c = $('#controls'); c.innerHTML = '';
  for (const [k, p] of Object.entries(mode.params)) {
    const id = `p-${mode.id}-${k}`, row = document.createElement('div'); row.className = 'ctl';
    row.innerHTML = `<div class="row"><label for="${id}">${p.label}</label><output for="${id}"></output></div><input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}">`;
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.value = p.v; out.textContent = fmt(p); inp.style.setProperty('--fill', fillPct(p)); p.el = inp; p.out = out;
    inp.addEventListener('input', () => { p.v = +inp.value; out.textContent = fmt(p); inp.style.setProperty('--fill', fillPct(p)); if (!p.reinit) mode.onParam?.(k); });
    inp.addEventListener('change', () => { if (p.reinit) { mode.init(); tele.reset(); if (k === 'k' && mode === Life) Life.drawMatrix(); } });
    c.appendChild(row);
  }
  const ex = $('#extra'); ex.innerHTML = ''; ex.hidden = !mode.extra; mode.extra?.(ex);
  const a = $('#actions'); a.querySelectorAll('.btn.mode').forEach(b => b.remove());
  (mode.actions || []).forEach(act => {
    const b = document.createElement('button'); b.className = 'btn mode'; b.type = 'button'; b.textContent = act.label;
    if (act.id) b.dataset.act = act.id; b.addEventListener('click', () => { act.fn(); tele.reset(); }); a.appendChild(b);
  });
  mode.syncExtra?.();
}
function setMode(i) {
  const next = MODES[i]; if (!next || next === mode) return;
  mode = next; hideMsg(); tele.reset();
  glc.hidden = !mode.gl; cv.hidden = !!mode.gl;
  clear2d(); mode.init(); buildUI();
  try { history.replaceState(null, '', '#' + mode.id); } catch (e) {}
}
function setPaused(p) { paused = p; $('#pauseBtn').textContent = p ? 'Devam et' : 'Duraklat'; $('#pausedTag').hidden = !p; }

function resize() {
  const ow = W, oh = H;
  DPR = Math.min(2, window.devicePixelRatio || 1); W = Math.max(1, view.clientWidth); H = Math.max(1, view.clientHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  glc.width = Math.round(W * Math.min(DPR, 1.5)); glc.height = Math.round(H * Math.min(DPR, 1.5));
  if (!mode) return;
  clear2d();
  if (mode.resize && ow > 1) mode.resize(ow, oh);
  else { clearTimeout(resize.t); resize.t = setTimeout(() => mode.init(), 160); }
  redrawFigures();
}

/* ---------- giriş ---------- */
function setXY(e) { const r = view.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; }
view.addEventListener('pointerdown', e => {
  setXY(e); ptr.px = ptr.x; ptr.py = ptr.y; ptr.down = true; ptr.active = true; ptr.shift = e.shiftKey || e.button === 2;
  try { view.setPointerCapture(e.pointerId); } catch (_) {}
});
view.addEventListener('pointermove', e => {
  setXY(e); if (e.pointerType === 'mouse') ptr.active = true;
  if (ptr.down) { ptr.shift = e.shiftKey || ptr.shift; mode.drag?.(ptr.x - ptr.px, ptr.y - ptr.py); }
  ptr.px = ptr.x; ptr.py = ptr.y;
});
const up = e => { ptr.down = false; ptr.shift = false; if (e.pointerType !== 'mouse') ptr.active = false; };
view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
view.addEventListener('pointerleave', () => { if (!ptr.down) ptr.active = false; });
view.addEventListener('contextmenu', e => e.preventDefault());
view.addEventListener('wheel', e => { if (mode.wheel) { e.preventDefault(); mode.wheel(e.deltaY); } }, { passive: false });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target.tagName;
  if (e.key === ' ' && tag !== 'INPUT') { e.preventDefault(); setPaused(!paused); }
  else if (e.key === 'r' || e.key === 'R') { mode.init(); tele.reset(); }
  else if (e.key === 'h' || e.key === 'H') togglePanel();
  else if (/^[1-5]$/.test(e.key)) setMode(+e.key - 1);
});
function togglePanel() { const p = $('#panel'), hidden = !p.classList.toggle('gone'); $('#showPanel').hidden = hidden; redrawFigures(); }
function redrawFigures() { if (mode === Life) Life.drawMatrix(); if (mode === RD) RD.drawFK(); }
$('#hide').addEventListener('click', togglePanel); $('#showPanel').addEventListener('click', togglePanel);
$('#collapse').addEventListener('click', () => { const c = $('#panel').classList.toggle('collapsed'); $('#collapse').textContent = c ? '+' : '–'; $('#collapse').setAttribute('aria-label', c ? 'Paneli genişlet' : 'Paneli daralt'); redrawFigures(); });
$('#pauseBtn').addEventListener('click', () => setPaused(!paused));
$('#resetBtn').addEventListener('click', () => { mode.init(); tele.reset(); });
addEventListener('resize', resize);

/* ---------- ana döngü ---------- */
let last = performance.now(), fpsT = last, fpsN = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t; frame++;
  fpsN++; if (t - fpsT > 500) { $('#fps').textContent = Math.round(fpsN * 1000 / (t - fpsT)) + ' fps'; fpsT = t; fpsN = 0; }
  if (!paused) { mode.step(dt); mode.draw(); }
  if (frame % 2 === 0) tele.draw();
}

buildTabs();
resize();
const start = Math.max(0, MODES.findIndex(m => '#' + m.id === location.hash));
setMode(start);
if (innerWidth <= 720) { $('#panel').classList.add('collapsed'); $('#collapse').textContent = '+'; }
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
