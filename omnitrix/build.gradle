plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.krolasyon.omnitrix'
base { archivesName = 'omnitrix_ben10-1.20.1-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'omnitrix.autotest', 'true'
            args '--width', '1280', '--height', '720'
            mods {
                omnitrix {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'omnitrix.refmap.json'
    config 'omnitrix.mixins.json'
}

repositories {}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "omnitrix", "Specification-Vendor": "krolasyon",
                    "Specification-Version": "1", "Implementation-Title": project.name,
                    "Implementation-Version": project.jar.archiveVersion,
                    "MixinConfigs": "omnitrix.mixins.json"])
    }
    finalizedBy 'reobfJar'
}
