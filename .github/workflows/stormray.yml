name: Storm Ray mod
on:
  push:
    paths:
      - 'stormray/**'
      - '.github/workflows/stormray.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stormray
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        id: b
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Visual self-test (headless client)
        if: steps.b.outputs.status == '0' && (contains(github.event.head_commit.message, '[vtest]') || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils zip > /dev/null
          mkdir -p run
          printf "onboardAccessibility:false\nrenderDistance:6\nsimulationDistance:5\npauseOnLostFocus:false\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nmaxFps:60\nfov:0.0\n" > run/options.txt
          set +e
          timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon > client.log 2>&1
          echo "client exit $?"
          mkdir -p vtest
          cp run/screenshots/ray_*.png vtest/ 2>/dev/null
          cp run/logs/latest.log vtest/latest.log 2>/dev/null
          tail -c 200000 client.log > vtest/client_tail.log
          grep -E "RAYTEST|Exception|ERROR|stormray" client.log | head -300 > vtest/summary.log
          cd vtest && zip -q ../vtest.zip * ; ls -la
      - name: Publish release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="stormray-${{ github.run_number }}"
          FILES="build.log"
          for f in build/libs/*.jar; do [ -f "$f" ] && FILES="$FILES $f"; done
          [ -f vtest.zip ] && FILES="$FILES vtest.zip"
          gh release create "$TAG" $FILES --title "Krolasyon Fırtına Vatozu ${{ github.run_number }} (status ${{ steps.b.outputs.status }})" \
            --notes "Forge 1.20.1 mod jar. commit ${{ github.sha }}" --prerelease --target "${{ github.sha }}"
      - name: Fail on build error
        if: steps.b.outputs.status != '0'
        run: exit 1
