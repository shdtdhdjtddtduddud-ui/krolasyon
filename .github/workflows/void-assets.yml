name: Void mod - fetch Higgsfield assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'void/gen/higgsfield_assets.json'
      - 'void/gen/process_higgsfield.py'
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          pip install pillow numpy
          rm -rf void/gen/higgsfield_raw
          python void/gen/process_higgsfield.py
      - name: Commit textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add void/gen/higgsfield_raw void/src/main/resources/assets/voidtree/textures
          git diff --cached --quiet || git commit -m "Higgsfield textures for void mod"
          git push
