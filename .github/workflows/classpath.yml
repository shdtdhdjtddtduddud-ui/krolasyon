name: Export compile classpath
on:
  push:
jobs:
  cp:
    if: contains(github.event.head_commit.message, '[cp]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle exportClasspath --no-daemon
      - run: cd build && zip -qr ../cp.zip cp && ls -la ../cp.zip
      - uses: actions/upload-artifact@v4
        with:
          name: classpath
          path: cp.zip
          retention-days: 3
