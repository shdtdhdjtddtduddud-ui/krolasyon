name: Build mod jar
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        id: b
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Server self-test (worldgen, dungeons, entities, skills)
        id: st
        if: steps.b.outputs.status == '0'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p run-server
          echo "eula=true" > run-server/eula.txt
          printf "online-mode=false\nlevel-seed=20241005\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\nlevel-name=world\n" > run-server/server.properties
          set +e
          timeout 900 gradle runServer --no-daemon > server.log 2>&1
          echo "exit $?"
          grep -E "AUTOTEST|FAIL|Exception|ERROR|Caused by|WARN.*sololeveling" server.log | grep -v "^[[:space:]]*at " | head -250 > autotest_summary.txt
          tail -25 server.log | grep -v "^[[:space:]]*at " >> autotest_summary.txt

      - name: API dump (javap of requested classes -> branch api-dump)
        if: always() && hashFiles('apidump/request.txt') != ''
        shell: bash
        run: |
          set +e
          mkdir -p apidump_out
          [ -f autotest_summary.txt ] && cp autotest_summary.txt apidump_out/_autotest.txt
          grep -B1 -A4 'error:' build.log | head -400 > apidump_out/_errors.txt
          tail -c 6000 build.log | grep -v '^\s*at ' > apidump_out/_build_tail.txt
          MAPPED=$(find ~/.gradle/caches -name '*mapped_official_1.20.1*.jar' | head -1)
          CP="$MAPPED:$(find ~/.gradle/caches/modules-2 ~/.gradle/caches/forge_gradle/maven_downloader -name '*.jar' 2>/dev/null | grep -v -- '-sources' | tr '\n' ':')"
          FORGE=$(find ~/.gradle/caches -name 'forge-1.20.1-47.2.0*universal*.jar' | head -1)
          echo "mapped=$MAPPED forge=$FORGE" > apidump_out/_info.txt
          [ -n "$MAPPED" ] && unzip -Z1 "$MAPPED" | grep '\.class$' | sed 's/\.class$//; s#/#.#g' | sort > apidump_out/_all_minecraft_classes.txt
          [ -n "$FORGE" ] && unzip -Z1 "$FORGE" | grep '\.class$' | sed 's/\.class$//; s#/#.#g' | sort > apidump_out/_all_forge_classes.txt
          while read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              \#*) continue;;
              *\*) pre="${line%\*}"; mapfile -t cls < <(cat apidump_out/_all_*_classes.txt | grep -F "$pre" | grep -v '\$' | head -80);;
              *) cls=("$line");;
            esac
            for c in "${cls[@]}"; do
              javap -protected -cp "$CP" "$c" > "apidump_out/$c.txt" 2>&1
            done
          done < apidump/request.txt
          rm -rf /tmp/adrepo && mkdir /tmp/adrepo && cp -r apidump_out/. /tmp/adrepo/
          cd /tmp/adrepo && git init -q && git checkout -q -b api-dump
          git config user.name "ci"; git config user.email "ci@example.com"
          git add -A && git commit -q -m "api dump for ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin api-dump

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            build.log
            server.log
            build/libs/*.jar
            run-server/logs/latest.log
            run-server/crash-reports/*

      - name: Publish release
        if: always() && contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          FILES="build.log"
          for f in build/libs/*.jar; do [ -f "$f" ] && FILES="$FILES $f"; done
          gh release create "$TAG" $FILES --title "Build ${{ github.run_number }} (status ${{ steps.b.outputs.status }})" --notes "commit ${{ github.sha }}" --target "${{ github.sha }}"

      - name: Fail on build error
        if: steps.b.outputs.status != '0'
        run: exit 1

  visual:
    needs: build
    if: contains(github.event.head_commit.message, '[vtest]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Visual self-test (headless client)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils imagemagick > /dev/null
          mkdir -p run
          printf "onboardAccessibility:false\nrenderDistance:8\nsimulationDistance:6\npauseOnLostFocus:false\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nmaxFps:60\nfov:-0.1\nlang:tr_tr\n" > run/options.txt
          set +e
          timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon > client.log 2>&1
          echo "client exit $?"
          mkdir -p shots
          for f in run/screenshots/sl_*.png; do [ -f "$f" ] && convert "$f" -resize 960x540 -quality 90 "shots/$(basename "$f" .png).jpg"; done
          grep -E "AUTOTEST|Exception|ERROR|FAIL|Caused by" client.log | grep -v "^[[:space:]]*at " | head -300 > shots/_client_summary.txt
          tail -30 client.log | grep -v "^[[:space:]]*at " >> shots/_client_summary.txt
          ls shots | wc -l
      - name: Publish screenshots to api-dump branch
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/shotrepo && mkdir /tmp/shotrepo && cd /tmp/shotrepo
          git init -q && git checkout -q -b shots
          cp -r "$GITHUB_WORKSPACE/shots/." . 2>/dev/null
          git config user.name ci; git config user.email ci@example.com
          git add -A && git commit -q -m "shots ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin shots
