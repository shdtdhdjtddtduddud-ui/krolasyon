name: Build mod jar
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        id: b
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Dedicated server self-test
        id: st
        if: steps.b.outputs.status == '0' && contains(github.event.head_commit.message, '[stest]')
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p run-server
          echo "eula=true" > run-server/eula.txt
          printf "level-seed=12345\nonline-mode=false\nspawn-protection=0\n" > run-server/server.properties
          set +e
          timeout 1500 gradle runServer --no-daemon > server.log 2>&1
          echo "server exit $?"
          grep -E "SERVERTEST|Exception|ERROR|Caused by" server.log | head -1500 > server_summary.log
          tail -c 100000 server.log > server_tail.log
      - name: Visual self-test (headless client)
        id: vt
        if: steps.b.outputs.status == '0' && contains(github.event.head_commit.message, '[vtest]')
        continue-on-error: true
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null
          mkdir -p run
          printf "onboardAccessibility:false\nrenderDistance:12\nsimulationDistance:8\npauseOnLostFocus:false\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nmaxFps:60\nfov:-0.45\n" > run/options.txt
          set +e
          timeout 2700 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon > client.log 2>&1
          echo "client exit $?"
          mkdir -p vtest
          cp run/screenshots/ktest_*.png vtest/ 2>/dev/null
          cp run/logs/latest.log vtest/latest.log 2>/dev/null
          tail -c 200000 client.log > vtest/client_tail.log
          grep -E "AUTOTEST|Exception|ERROR" client.log | head -2000 > vtest/summary.log
          cd vtest && zip -q ../vtest.zip * ; ls -la
      - name: Production server test (real Forge install)
        id: ps
        if: steps.b.outputs.status == '0' && contains(github.event.head_commit.message, '[ptest]')
        continue-on-error: true
        shell: bash
        run: |
          set +e
          FV=$(curl -sSL https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json | python3 -c "import sys,json;p=json.load(sys.stdin)['promos'];print(p.get('1.20.1-recommended') or p['1.20.1-latest'])")
          echo "forge $FV" | tee prod_server.log
          mkdir -p prodsrv && cd prodsrv
          curl -sSLo inst.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-$FV/forge-1.20.1-$FV-installer.jar"
          java -jar inst.jar --installServer > install.log 2>&1; echo "install exit $?" >> ../prod_server.log
          mkdir -p mods && cp ../build/libs/sololeveling-*.jar mods/
          echo "eula=true" > eula.txt
          printf "online-mode=false\nlevel-seed=777\n" > server.properties
          echo "-Duser.language=tr -Duser.country=TR" >> user_jvm_args.txt
          (sleep 240; echo stop) | timeout 600 ./run.sh nogui > srv.log 2>&1; echo "server exit $?" >> ../prod_server.log
          grep -E "Done \(|Exception|ERROR|Caused by|FATAL|krolasyon|Mod File|requires" srv.log | head -800 >> ../prod_server.log
          cp logs/latest.log ../prod_server_latest.log 2>/dev/null
          cp crash-reports/*.txt ../ 2>/dev/null; ls crash-reports 2>/dev/null
      - name: Prepare production client test
        if: steps.b.outputs.status == '0' && contains(github.event.head_commit.message, '[ptest]')
        shell: bash
        run: |
          rm -rf run && mkdir -p run/mods && cp build/libs/sololeveling-*.jar run/mods/ && ls run/mods
      - name: Production client test (real Forge client, joins a world)
        id: pc
        if: steps.b.outputs.status == '0' && contains(github.event.head_commit.message, '[ptest]')
        continue-on-error: true
        uses: headlesshq/mc-runtime-test@4.5.2
        with:
          mc: 1.20.1
          modloader: forge
          regex: .*forge.*
          mc-runtime-test: lexforge
          java: 17
      - name: Collect production client logs
        if: always() && contains(github.event.head_commit.message, '[ptest]')
        shell: bash
        run: |
          echo "client outcome: ${{ steps.pc.outcome }}" > prod_client.log
          find . -path ./prodsrv -prune -o \( -name latest.log -o -name "crash-*.txt" -o -name debug.log \) -print 2>/dev/null | head -20 >> prod_client.log
          for f in $(find . -path ./prodsrv -prune -o \( -name latest.log -o -name "crash-*.txt" \) -print 2>/dev/null | grep -v prod_server | head -5); do echo "=== $f"; tail -c 60000 "$f"; done >> prod_client.log
          for f in $(find / -xdev -path /proc -prune -o \( -name "crash-*client*.txt" \) -print 2>/dev/null | head -3); do echo "=== $f"; cat "$f"; done >> prod_client.log
      - name: Publish release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          FILES="build.log"
          for f in build/libs/*.jar; do [ -f "$f" ] && FILES="$FILES $f"; done
          [ -f vtest.zip ] && FILES="$FILES vtest.zip"
          [ -f server_summary.log ] && FILES="$FILES server_summary.log server_tail.log"
          for f in prod_server.log prod_server_latest.log prod_client.log crash-*.txt; do [ -f "$f" ] && FILES="$FILES $f"; done
          gh release create "$TAG" $FILES --title "Build ${{ github.run_number }} (status ${{ steps.b.outputs.status }})" --notes "commit ${{ github.sha }}" --prerelease --target "${{ github.sha }}"
      - name: Fail on build error
        if: steps.b.outputs.status != '0'
        run: exit 1
