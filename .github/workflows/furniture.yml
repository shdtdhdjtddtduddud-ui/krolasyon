name: Build furniture mod jar
on:
  push:
    paths:
      - 'furniture/**'
      - '.github/workflows/furniture.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: furniture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        id: b
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="furniture-${{ github.run_number }}"
          FILES="build.log"
          for f in build/libs/*.jar; do [ -f "$f" ] && FILES="$FILES $f"; done
          gh release create "$TAG" $FILES --title "Furniture build ${{ github.run_number }} (status ${{ steps.b.outputs.status }})" --notes "commit ${{ github.sha }}" --prerelease --target "${{ github.sha }}"
      - name: Visual self-test (headless client)
        id: vt
        if: steps.b.outputs.status == '0' && contains(github.event.head_commit.message, '[vtest]')
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null
          mkdir -p run
          printf "onboardAccessibility:false\nrenderDistance:5\nsimulationDistance:5\npauseOnLostFocus:false\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nmaxFps:60\nfov:-0.1\n" > run/options.txt
          set +e
          (xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon > client.log 2>&1 &)
          for i in $(seq 1 60); do
            sleep 10
            grep -q "AUTOTEST\] finished" client.log 2>/dev/null && break
          done
          sleep 5
          pkill -9 -f java; pkill -9 -f Xvfb; sleep 2
          mkdir -p vtest
          cp run/screenshots/ftest_*.png vtest/ 2>/dev/null
          cp run/logs/latest.log vtest/latest.log 2>/dev/null
          tail -c 200000 client.log > vtest/client_tail.log
          grep -E "AUTOTEST|Exception|ERROR" client.log | head -300 > vtest/summary.log
          pkill -9 -f java || true
          cd vtest && zip -q ../vtest.zip * ; ls -la
          cd .. && gh release upload "furniture-${{ github.run_number }}" vtest.zip --clobber
      - name: Fail on build error
        if: steps.b.outputs.status != '0'
        run: exit 1
