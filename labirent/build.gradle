plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.krolasyon.labirent'
base { archivesName = 'labirent_olumcul_kacis-1.20.1-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'labirent.autotest', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--width', '1280', '--height', '720'
            mods {
                labirent {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // only for the CI shader screenshot run: gradle runClient -PoculusVer=... -PembeddiumVer=...
    if (project.hasProperty('oculusVer')) {
        runtimeOnly fg.deobf("maven.modrinth:embeddium:${project.embeddiumVer}")
        runtimeOnly fg.deobf("maven.modrinth:oculus:${project.oculusVer}")
    }
}

tasks.register('shaderZip', Zip) {
    from('shaderpack') { include 'shaders/**' }
    archiveFileName = 'Labirent_Shaders.zip'
    destinationDirectory = layout.buildDirectory.dir('libs')
}
tasks.named('build').configure { dependsOn 'shaderZip' }

mixin {
    add sourceSets.main, 'labirent.refmap.json'
    config 'labirent.mixins.json'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "labirent", "Specification-Vendor": "krolasyon",
                    "Specification-Version": "1", "Implementation-Title": project.name,
                    "Implementation-Version": project.jar.archiveVersion, "MixinConfigs": "labirent.mixins.json"])
    }
    finalizedBy 'reobfJar'
}

// CI helper: bundles the compile classpath so the sources can be type-checked offline
tasks.register('exportClasspath', Zip) {
    from(configurations.compileClasspath)
    archiveFileName = 'classpath.zip'
    destinationDirectory = layout.buildDirectory.dir('cp')
}
