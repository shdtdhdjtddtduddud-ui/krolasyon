# Labirent Shaders — made for "Labirent: Olumcul Kacis"
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
separateAo=true
clouds=fancy
frustum.culling=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true

blend.gbuffers_spidereyes=SRC_ALPHA ONE ONE ONE
blend.gbuffers_beaconbeam=SRC_ALPHA ONE ONE ONE
blend.gbuffers_armor_glint=SRC_COLOR ONE ZERO ONE
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

sliders=SHADOW_SOFTNESS SHADOW_SAMPLES SSAO_STRENGTH VL_STEPS VL_STRENGTH FOG_DENSITY MAZE_HAZE WAVE_SPEED WAVE_STRENGTH WALL_RELIEF \
  BLOOM_STRENGTH EXPOSURE SATURATION CINEMATIC_GRADE VIGNETTE FILM_GRAIN CHROMATIC_ABERRATION shadowMapResolution shadowDistance sunPathRotation

screen=<profile> <empty> [LIGHTING] [ATMOSPHERE] [WORLD] [CAMERA]
screen.LIGHTING=SHADOWS shadowMapResolution SHADOW_SOFTNESS SHADOW_SAMPLES shadowDistance sunPathRotation SSAO SSAO_STRENGTH
screen.ATMOSPHERE=VOLUMETRIC_LIGHT VL_STEPS VL_STRENGTH FOG_DENSITY MAZE_HAZE STARS
screen.WORLD=WAVING_PLANTS WAVING_IVY WAVE_SPEED WAVE_STRENGTH WALL_RELIEF WATER_REFLECTIONS
screen.CAMERA=BLOOM BLOOM_STRENGTH EXPOSURE SATURATION CINEMATIC_GRADE VIGNETTE FILM_GRAIN CHROMATIC_ABERRATION

profile.DUSUK=!SSAO !VOLUMETRIC_LIGHT shadowMapResolution=1024 SHADOW_SAMPLES=6 VL_STEPS=6 shadowDistance=64.0
profile.ORTA=SSAO VOLUMETRIC_LIGHT shadowMapResolution=2048 SHADOW_SAMPLES=12 VL_STEPS=12 shadowDistance=120.0
profile.ULTRA=SSAO VOLUMETRIC_LIGHT shadowMapResolution=4096 SHADOW_SAMPLES=20 VL_STEPS=32 shadowDistance=220.0
