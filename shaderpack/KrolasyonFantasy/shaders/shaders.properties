# =====================================================================
#  Krolasyon Fantasy Shaders - Minecraft 1.20.1 (Forge + Oculus / Iris)
# =====================================================================

oldLighting=false
oldHandLight=false
separateAo=true
underwaterOverlay=false
vignette=false
sun=false
moon=false
frustum.culling=true
rain.depth=false
beacon.beam.depth=true
particles.before.deferred=false

shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true

#ifdef CUSTOM_CLOUDS
clouds=off
#endif

# ---------------------------------------------------------------------
# Menü
# ---------------------------------------------------------------------
screen=<profile> SKY_THEME <empty> <empty> [FANTASY] [SKY] [LIGHTING] [SHADOWS] [WATER] [ATMOSPHERE] [MOTION] [CAMERA]
screen.columns=2

screen.FANTASY=BIOLUMINESCENCE BIOLUM_STRENGTH LOG_VEINS CRYSTAL_SPARKLE FIREFLIES FIREFLY_AMOUNT MAGIC_DUST
screen.SKY=PLANETS NEBULA AURORA STARS STAR_AMOUNT <empty> CUSTOM_CLOUDS CLOUD_COVERAGE CLOUD_HEIGHT
screen.LIGHTING=SUN_BRIGHTNESS MOON_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS HANDHELD_LIGHT <empty> SSAO SSAO_STRENGTH
screen.SHADOWS=SHADOWS COLORED_SHADOWS shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_SAMPLES sunPathRotation
screen.WATER=WATER_WAVES WAVE_HEIGHT WATER_REFLECTIONS WATER_GLOW CAUSTICS WATER_ALPHA
screen.ATMOSPHERE=VOLUMETRIC_LIGHT VL_STRENGTH VL_STEPS <empty> FOG_DENSITY BORDER_FOG WEATHER_FOG WEATHER_FOG_BRIGHTNESS
screen.MOTION=WAVING_PLANTS WAVING_LEAVES WIND_STRENGTH
screen.CAMERA=BLOOM BLOOM_STRENGTH EXPOSURE NIGHT_BRIGHTNESS SATURATION FANTASY_GRADE VIGNETTE VIGNETTE_STRENGTH FXAA SHARPEN

sliders=shadowMapResolution shadowDistance sunPathRotation SHADOW_SOFTNESS SHADOW_SAMPLES \
    SUN_BRIGHTNESS MOON_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS SSAO_STRENGTH \
    BIOLUM_STRENGTH FIREFLY_AMOUNT STAR_AMOUNT CLOUD_COVERAGE CLOUD_HEIGHT \
    WAVE_HEIGHT WATER_ALPHA VL_STRENGTH VL_STEPS FOG_DENSITY WEATHER_FOG_BRIGHTNESS WIND_STRENGTH \
    BLOOM_STRENGTH EXPOSURE NIGHT_BRIGHTNESS SATURATION FANTASY_GRADE VIGNETTE_STRENGTH SHARPEN

# ---------------------------------------------------------------------
# Kalite profilleri
# ---------------------------------------------------------------------
profile.LOW=!SHADOWS !VOLUMETRIC_LIGHT !SSAO !WATER_REFLECTIONS !CAUSTICS shadowMapResolution=1024 shadowDistance=64.0 SHADOW_SAMPLES=4 VL_STEPS=6 !BLOOM
profile.MEDIUM=SHADOWS VOLUMETRIC_LIGHT !SSAO WATER_REFLECTIONS CAUSTICS shadowMapResolution=1536 shadowDistance=96.0 SHADOW_SAMPLES=4 VL_STEPS=8 BLOOM
profile.HIGH=SHADOWS VOLUMETRIC_LIGHT SSAO WATER_REFLECTIONS CAUSTICS shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=8 VL_STEPS=12 BLOOM
profile.ULTRA=SHADOWS VOLUMETRIC_LIGHT SSAO WATER_REFLECTIONS CAUSTICS shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=16 VL_STEPS=16 BLOOM
