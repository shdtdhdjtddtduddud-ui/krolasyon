# Fjord Mist Shaders for Iris / Oculus (Minecraft 1.20.1 Forge)

clouds=off
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
separateAo=false
frustum.culling=true
dynamicHandLight=true

shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true

texture.noise=textures/noise.png

# water / glass only write their data buffers, never blend them
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_hand_water.colortex2=off
# rain is accumulated premultiplied in colortex5
blend.gbuffers_weather=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# -------------------------------------------------------------- profiles
profile.LOW=!SSAO shadowMapResolution=1024 shadowDistance=96.0 CLOUD_STEPS=12 CLOUD_LIGHT_STEPS=2 MIST_STEPS=8 SSR_STEPS=12 !CLOUDS_ON_TERRAIN !VOLUMETRIC_LIGHT !MIST_BAND !RAIN_RIPPLES SHADOW_SOFTNESS=0.5
profile.MEDIUM=shadowMapResolution=1536 shadowDistance=128.0 CLOUD_STEPS=16 CLOUD_LIGHT_STEPS=3 MIST_STEPS=10 SSR_STEPS=16 !CLOUDS_ON_TERRAIN VOLUMETRIC_LIGHT MIST_BAND RAIN_RIPPLES SHADOW_SOFTNESS=1.0
profile.HIGH=shadowMapResolution=2048 shadowDistance=128.0 CLOUD_STEPS=22 CLOUD_LIGHT_STEPS=4 MIST_STEPS=14 SSR_STEPS=22 CLOUDS_ON_TERRAIN VOLUMETRIC_LIGHT MIST_BAND RAIN_RIPPLES SHADOW_SOFTNESS=1.0
profile.ULTRA=shadowMapResolution=4096 shadowDistance=192.0 CLOUD_STEPS=36 CLOUD_LIGHT_STEPS=6 MIST_STEPS=20 SSR_STEPS=36 CLOUDS_ON_TERRAIN VOLUMETRIC_LIGHT MIST_BAND RAIN_RIPPLES SHADOW_SOFTNESS=1.0

# ---------------------------------------------------------------- menus
screen=<profile> <empty> [ATMOSPHERE] [CLOUDS] [WATER] [VEGETATION] [SKY] [LIGHTING] [CAMERA]
screen.columns=2

screen.ATMOSPHERE=OVERCAST FOG_DENSITY MIST MIST_DENSITY MIST_HEIGHT MIST_STEPS MIST_BAND <empty> MIST_BAND_LOW MIST_BAND_HIGH VOLUMETRIC_LIGHT VL_STRENGTH WIND_SPEED
screen.CLOUDS=VOLUMETRIC_CLOUDS CLOUDS_ON_TERRAIN CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_SCALE CLOUD_STEPS CLOUD_LIGHT_STEPS
screen.WATER=WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_CLARITY WATER_VERTEX_WAVES WATER_REFRACTION WATER_FOAM FOAM_AMOUNT RAIN_RIPPLES RAIN_STREAKS RAIN_VISIBILITY SSR_STEPS <empty> WET_REFLECTIONS PUDDLES WETNESS_STRENGTH
screen.VEGETATION=WAVING_PLANTS WAVING_LEAVES WAVING_STRENGTH FOLIAGE_TRANSLUCENCY
screen.SKY=STARS SHOOTING_STARS AURORA AURORA_STRENGTH RAINBOW LIGHTNING_FLASH LENS_FLARE LENS_FLARE_STRENGTH
screen.LIGHTING=shadowMapResolution shadowDistance sunPathRotation SHADOW_SOFTNESS SSAO AO_STRENGTH CAUSTICS <empty> SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS MIN_LIGHT
screen.CAMERA=EXPOSURE AUTO_EXPOSURE BLOOM BLOOM_STRENGTH FJORD_GRADE SATURATION CONTRAST VIGNETTE FILM_GRAIN RAIN_ON_LENS

sliders=OVERCAST FOG_DENSITY MIST_DENSITY MIST_HEIGHT MIST_BAND_LOW MIST_BAND_HIGH MIST_STEPS VL_STRENGTH WIND_SPEED \
 CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_STEPS CLOUD_LIGHT_STEPS CLOUD_SCALE \
 WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_CLARITY FOAM_AMOUNT RAIN_VISIBILITY SSR_STEPS WETNESS_STRENGTH \
 WAVING_STRENGTH FOLIAGE_TRANSLUCENCY \
 shadowMapResolution shadowDistance sunPathRotation SHADOW_SOFTNESS SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS MIN_LIGHT \
 AURORA_STRENGTH LENS_FLARE_STRENGTH AO_STRENGTH \
 EXPOSURE BLOOM_STRENGTH SATURATION CONTRAST VIGNETTE FILM_GRAIN
