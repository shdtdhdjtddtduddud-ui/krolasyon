// Shader paketini gerçek oyunda (Oculus + Embeddium) deneyen, yalnızca CI'da kullanılan test modu.
plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'com.krolasyon.shadertest'
base { archivesName = 'krolasyon_shadertest' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--width', '960', '--height', '540'
            mods {
                shadertest {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    runtimeOnly fg.deobf("maven.modrinth:embeddium:${embeddiumVersion}")
    runtimeOnly fg.deobf("maven.modrinth:oculus:${oculusVersion}")
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
