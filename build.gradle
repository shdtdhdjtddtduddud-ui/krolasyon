plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'com.krolasyon.bosses'
base { archivesName = 'krolasyon_bosses-1.20.1-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "krolasyonbosses", "Specification-Vendor": "krolasyon",
                    "Specification-Version": "1", "Implementation-Title": project.name,
                    "Implementation-Version": project.jar.archiveVersion])
    }
    finalizedBy 'reobfJar'
}
