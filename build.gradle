plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'com.krolasyon.sololeveling'
base { archivesName = 'sololeveling-1.20.1-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'info'
            property 'sololeveling.servertest', 'true'
            jvmArgs '-Duser.language=tr', '-Duser.country=TR'
            args '--nogui'
            mods {
                sololeveling {
                    source sourceSets.main
                }
            }
        }
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'sololeveling.autotest', 'true'
            jvmArgs '-Duser.language=tr', '-Duser.country=TR'
            args '--width', '1280', '--height', '720'
            mods {
                sololeveling {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs << '-Xmaxerrs' << '2000' }

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "sololeveling", "Specification-Vendor": "krolasyon",
                    "Specification-Version": "1", "Implementation-Title": project.name,
                    "Implementation-Version": project.jar.archiveVersion])
    }
    finalizedBy 'reobfJar'
}
