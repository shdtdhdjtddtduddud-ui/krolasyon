plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.6.0'
group = 'com.krolasyon.beyblade'
base { archivesName = 'beyblade_mod-1.20.1-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'libra.autotest', 'true'
            args '--width', '1280', '--height', '720'
            mods {
                librabeyblade {
                    source sourceSets.main
                }
            }
        }
    }
}

// This branch builds only the Libra beyblade mod; the boss mod lives on the boss-mod branch.
sourceSets.main.java.exclude 'com/krolasyon/bosses/**'
sourceSets.main.resources.exclude 'assets/krolasyonbosses/**'

repositories {}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "librabeyblade", "Specification-Vendor": "krolasyon",
                    "Specification-Version": "1", "Implementation-Title": project.name,
                    "Implementation-Version": project.jar.archiveVersion])
    }
    finalizedBy 'reobfJar'
}
